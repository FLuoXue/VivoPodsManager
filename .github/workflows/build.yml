name: Windows build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build VivoPodsManager.sln -c Release
      - run: dotnet run --project tests/VivoPods.Tests -c Release --no-build
      - run: pwsh -File scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VivoPodsManager-win-x64
          path: artifacts/VivoPodsManager-win-x64.zip
